name: windows-desktop
on:
  workflow_dispatch:          # 手动触发，别把长构建挂在每次 push 上

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6   # 自动读 package.json 的 packageManager 字段（10.10.0）

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master   # rust-toolchain.toml 会自动锁 1.96.1
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2          # 二次构建从 60 分钟降到 ~15 分钟
        with:
          workspaces: |
            .
            crates/openhuman-app

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri app (frontend + core + NSIS/MSI)
        shell: bash
        working-directory: crates/openhuman-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: ../../app/node_modules/.bin/tauri build -- --bin OpenHuman
        
      - uses: actions/upload-artifact@v4
        with:
          name: openhuman-windows
          path: |
            crates/openhuman-app/target/release/bundle/nsis/*.exe
            crates/openhuman-app/target/release/bundle/msi/*.msi
